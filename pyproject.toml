[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gedinfo"
version = "0.22.0"
requires-python = ">=3.11"
description = "GEDCOM query utility"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Bedarida", email = "alex.bedarida@gmail.com" }]
keywords = ["gedcom", "genealogy", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Sociology :: Genealogy",
]
dependencies = ["faker", "textual"]

[project.urls]
Homepage = "https://github.com/AleBeda/gedinfo"
Repository = "https://github.com/AleBeda/gedinfo"

[tool.setuptools]
packages = {find = {where = ["."]}}

[tool.setuptools.package-data]
gedinfo = ["data/*.txt"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set (pycodestyle E4/E7/E9 + Pyflakes F); line length is
# handled by the formatter rather than the E501 lint rule.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Single-letter loop variables in comprehensions are pervasive and acceptable
# in the test suite.
"tests/**" = ["E741"]
# __init__ modules re-export submodules for convenient access.
"__init__.py" = ["F401"]

[project.entry-points."console_scripts"]
gedinfo = "gedinfo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
